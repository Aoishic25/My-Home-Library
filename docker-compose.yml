services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    # The seed dump was created on a case-insensitive OS (macOS/Windows) and its
    # foreign keys mix cases (`writer`.`c_author`, `Writer`.`CH_Author`, ...).
    # Linux MySQL is case-sensitive by default, so those keys can't resolve and
    # every insert into a Shelf book table fails. 1 = store names lowercase and
    # compare case-insensitively, like the original setup. This can only be set
    # when the data volume is first created (see README: `docker compose down -v`).
    command: --lower-case-table-names=1
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    # No host port published for MySQL — app and phpMyAdmin reach it over
    # the internal Docker network. Uncomment and pick a free host port
    # (e.g. "3307:3306") if you want to connect an external tool like
    # MySQL Workbench to it directly.
    # ports:
    #   - "3306:3306"
    healthcheck:
      # --protocol=tcp forces a real TCP check against port 3306, so this
      # doesn't report "healthy" against MySQL's brief internal bootstrap
      # server (which only listens on a local socket) during first-run
      # initialization.
      test: ["CMD", "mysqladmin", "ping", "--protocol=tcp", "-h", "127.0.0.1", "-P", "3306", "-uroot", "-p${DATABASE_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "8000:80"
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_HOST: db
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE: ${DATABASE}
      SKIP_PHP_ADMIN: "true"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
